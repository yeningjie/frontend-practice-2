<!DOCTYPE html>
<html lang="zh-CN">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width,initial-scale=1.0">
     <title>课程反馈</title>
</head>
<body>
      <header>
              <h1>课程反馈</h1>
              <p>你的意见直接改进下一次授课</p>
      </header>
  
      <main>
             <section id="intro">
                 <h2>填写说明</h2>
                 <p>匿名收集，仅用于改进教学</p>
              </section>

      <section id="form">
           <h2>反馈表单</h2>
   <form action="#"method="post">
   <label for="name">你的名字（选填）</label>
   <input type="text" id="name" name="name" placeholder="匿名也可以">
  <label for="rating">课程评分</label>
  <select id="rating" name="rating">
  <option value="5">非常满意</option>
  <option value="4">满意</option>
  <option value="3">一般</option>
  <option value="2">不满意</option>
  <option value="1">非常不满意</option>
</select>

<label for ="comment">你的建议</label>
<textarea id="comment" 
name="comment"rows="4"
 placeholder="写下你的想法..."></textarea>

<button type="submit">提交反馈</buttom>
</form>
      </section>
</main>

<footer>
<p>&copy; 2026前端开发实践</p>
</footer>
</body>
</html>
