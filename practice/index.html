<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社团报名系统</title>
    <!-- 预留样式文件 -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <!-- 1. 头部导航栏 -->
    <header>
        <div class="logo">🏫 校园社团招新</div>
        <nav>
            <a href=" ">热门社团</a >
            <a href="#join">我要报名</a >
        </nav>
    </header>

    <!-- 2. 主体内容 -->
    <main>
        <!-- 社团展示区（第2步会在这里加卡片） -->
        <section id="activities">
            <h2>🔥 热门社团展示</h2>
            <p>点击下方卡片查看详情并报名...</p >
            <!-- 待补充社团卡片 -->
<div class="card-container">
                <div class="card">
                    <h3>🎸 吉他社</h3>
                    <p>零基础也能加入，每周三下午排练。</p >
                    <button onclick="selectClub('吉他社')">我要报名</button>
                </div>

                <div class="card">
                    <h3>📷 摄影社</h3>
                    <p>一起拍照、修图、办展览。</p >
                    <button onclick="selectClub('摄影社')">我要报名</button>
                </div>

                <div class="card">
                    <h3>💻 编程社</h3>
                    <p>学编程、做项目、打比赛。</p >
                    <button onclick="selectClub('编程社')">我要报名</button>
                </div>
            </div>
        </section>

        <!-- 报名表单区（第3步会在这里加表单） -->
        <section id="join">
            <h2>📝 在线报名表</h2>
            <!-- 待补充表单 -->
        </section>
    </main>

    <!-- 3. 底部信息 -->
    <footer>
        <p>&copy; 2024 学生社团联合会 | 技术支持：自主实践小组</p >
    </footer>

</body>
</html>
